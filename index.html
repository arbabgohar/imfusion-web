<!doctype html>
<html>

    <input type="file" id="fileInput" />
    <div id="status">Starting...</div>
    <div id="controls" style="display:none; margin:8px 0; font-family:sans-serif">

      <label>Window <input id="windowSlider" type="range" /> <span id="windowVal"></span></label>

    <canvas id="canvas" style="width:100%;height:80vh"></canvas>
